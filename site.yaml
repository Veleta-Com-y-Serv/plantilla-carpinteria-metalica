    preguntas:
      - { pregunta: "¿La medición tiene coste?", respuesta: "No. Vamos a tu casa, medimos y te damos el presupuesto por escrito sin compromiso." }
      - { pregunta: "¿Cuánto se tarda en fabricar unas ventanas?", respuesta: "Depende del perfil y del vidrio. Te damos la fecha de instalación cuando aceptas el presupuesto." }
      - { pregunta: "¿Hace falta obra para cambiar las ventanas?", respuesta: "Casi nunca. Quitamos las viejas, colocamos las nuevas sobre el mismo hueco y rematamos por dentro y por fuera." }
      - { pregunta: "¿Necesito permiso para cerrar la terraza?", respuesta: "Suele hacer falta el visto bueno de la comunidad y una comunicación al ayuntamiento. Te decimos qué pedir antes de empezar." }
