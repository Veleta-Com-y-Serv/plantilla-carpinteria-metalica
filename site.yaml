    items:
      - titulo: Alcañiz
        texto: "Aquí está nuestro taller, en el polígono Las Horcas, y aquí hemos hecho la mayoría de los encargos: ventanas de aluminio en pisos del centro, cerramientos de terraza en los bloques nuevos, rejas y balcones de forja en las casas del casco antiguo y mamparas en los baños que se reforman. Al estar tan cerca, vamos a medir en pocos días y, si se rompe un cristal, lo cambiamos enseguida."
      - titulo: Calanda
        texto: "En Calanda trabajamos mucho en casas de piedra, donde las ventanas nuevas tienen que respetar la fachada. Hacemos ventanas de aluminio imitación madera y de PVC, contraventanas, rejas y puertas de garaje. También cerramos patios y porches con estructuras ligeras para aprovecharlos todo el año."
      - titulo: Caspe
        texto: "En Caspe hacemos sobre todo mamparas de baño, vidrios y espejos a medida, ventanas para segundas residencias junto al embalse y barandillas para terrazas. Medimos un día, fabricamos en Alcañiz y volvemos a instalar con todo listo, para que la obra dure lo menos posible."
      - titulo: Andorra
        texto: "En Andorra y la Sierra de Arcos instalamos ventanas con buen aislamiento para los inviernos fríos, persianas motorizadas, barandillas de escalera y puertas de garaje seccionales. Cuéntanos qué necesitas y te damos día para ir a medir sin compromiso."
