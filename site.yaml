  servicios:
    activa: true
    antetitulo: Qué hacemos
    titulo: Hecho a medida, del primer milímetro
    texto: "Lo que más nos piden. Si no está en la lista, pregúntanos: casi seguro que lo hacemos."
    items:
      - titulo: Ventanas de aluminio y PVC
        texto: "Abatibles, oscilobatientes o correderas, con doble o triple vidrio."
        categoria: Aluminio y PVC
        precio: "Desde 290 €"
        imagenes: "/fotos/trabajo-ventanas.jpg; /fotos/hero.jpg"
        detalle: |
          Cambiar las ventanas es lo que más se nota en casa: menos frío en invierno, menos calor en verano y menos ruido de la calle. Fabricamos ventanas de aluminio con rotura de puente térmico y de PVC, abatibles, oscilobatientes o correderas, con el vidrio que necesite cada orientación.

          Vamos a medir cada hueco, porque en las casas antiguas no hay dos iguales. Te enseñamos muestras de perfiles y colores, también imitación madera para las fachadas de piedra del casco antiguo, y te damos el presupuesto cerrado por escrito.

          Las ventanas se cortan y se montan en nuestro taller. El día de la instalación quitamos las viejas, colocamos las nuevas, sellamos por dentro y por fuera y recogemos todo. En la mayoría de pisos lo hacemos en un solo día.
      - titulo: Cerramientos de terraza
        texto: "Correderas, cortinas de cristal y techos para ganar una habitación."
        categoria: Aluminio y PVC
        precio: "Consultar"
        imagenes: "/fotos/trabajo-cerramiento.jpg"
        detalle: |
          Un cerramiento convierte una terraza que solo usas en verano en una habitación más de la casa: para comer, para tender o para leer al sol en enero. Los hacemos con correderas de aluminio, con cortina de cristal sin perfiles verticales o con techo fijo o practicable.

          Antes de empezar revisamos contigo lo que permite la comunidad y el ayuntamiento, para que el cerramiento cumpla y no dé problemas. Elegimos juntos el color de los perfiles para que case con la fachada.

          Fabricamos todo a medida en el taller y lo montamos en uno o dos días, según el tamaño. Dejamos la terraza limpia y te explicamos cómo abrir, cerrar y limpiar cada hoja.
      - { titulo: Persianas y mosquiteras, texto: "Persianas de aluminio, motorizadas o de cinta, y mosquiteras enrollables.", categoria: Aluminio y PVC, precio: "Desde 95 €" }
      - titulo: Mamparas de baño
        texto: "De vidrio templado, fijas, abatibles o correderas, a la medida de tu ducha."
        categoria: Cristalería
        precio: "Desde 260 €"
        imagenes: "/fotos/trabajo-mampara.jpg"
        detalle: |
          Una mampara a medida aprovecha hasta el último centímetro del baño y no deja salir el agua. Las hacemos de vidrio templado de seguridad, transparente, mate o al ácido, con perfiles en plata, blanco o negro mate.

          Medimos el plato y las paredes en tu casa, porque casi nunca están del todo rectas, y te proponemos la apertura que mejor va: fija, abatible o corredera. Si cambias la bañera por un plato de ducha, nos coordinamos con quien haga la obra.

          La instalamos en una mañana, con silicona sanitaria y todo nivelado. Te dejamos los consejos para que el vidrio se mantenga como el primer día.
      - { titulo: Vidrios y espejos, texto: "Cristales rotos, doble acristalamiento, espejos y vidrio de seguridad a medida.", categoria: Cristalería, precio: "Consultar" }
      - titulo: Barandillas y pasamanos
        texto: "De acero, hierro forjado o acero y vidrio, para escaleras, balcones y terrazas."
        categoria: Cerrajería y forja
        precio: "Consultar"
        imagenes: "/fotos/trabajo-barandilla.jpg"
        detalle: |
          Una barandilla tiene que ser segura, pero también puede ser lo más bonito de la escalera. Las fabricamos de pletina de acero, de hierro forjado o de acero con vidrio, con pasamanos de madera o metálico, para escaleras interiores, balcones y terrazas.

          Vamos a medir y a ver el tipo de peldaño o de forjado donde se va a anclar. Te dibujamos el diseño con las medidas y te damos el presupuesto cerrado. Todas cumplen la altura y la separación entre barrotes que marca la normativa.

          Soldamos, lijamos y pintamos cada pieza en el taller, con imprimación contra el óxido si va al exterior. La instalación suele ser de un día y sin obra.
      - { titulo: Rejas y cancelas, texto: "Rejas de ventana, cancelas de patio y puertas de forja a medida.", categoria: Cerrajería y forja, precio: "Desde 180 €" }
      - { titulo: Puertas de garaje, texto: "Seccionales, basculantes o batientes, con motor y mando a distancia.", categoria: Cerrajería y forja, precio: "Consultar" }
      - { titulo: Pérgolas y estructuras ligeras, texto: "Pérgolas de acero o aluminio, porches y altillos para naves.", categoria: Cerrajería y forja, precio: "Consultar" }

